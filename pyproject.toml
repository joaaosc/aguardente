[project]
name = "aguardente"
version = "1.0.0"
description = "Poda estruturada, destilação e conversão para Core AI"
requires-python = ">=3.11,<3.14"

# O núcleo analítico (probe, arch, plan, budget, fetch) não depende de torch.
dependencies = []

[project.optional-dependencies]
pipeline = [
    "torch>=2.8.0",
    "transformers>=5.5.0",
    "datasets>=4.0,<5.0",
    "accelerate>=1.12,<2.0",
    "coreai-torch",
    "coreai-opt",
    "coreai-models @ git+https://github.com/apple/coreai-models@main#subdirectory=python",
]
dev = ["pytest>=8.0"]

[project.scripts]
aguardente = "aguardente.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aguardente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
